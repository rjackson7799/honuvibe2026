document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .2s ease,color .2s ease\" style-hover=\"color:#F6F1E2\">{{ l.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <a href=\"./Homepage 4b.dc.html#pricing\" style=\"font-size:15px;color:#F6F1E2\">Sign in<\u002Fa>\n      <a href=\"#enquire\" style=\"background:#E9A63B;color:#0E3629;padding:11px 18px;border-radius:8px;font-size:15px;font-weight:600;min-height:44px;display:inline-flex;align-items:center\">Talk to us<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"background:#0E3629;color:#F6F1E2;padding:40px 0 60px\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:44px;align-items:center\">\n    <div>\n      <div data-intro=\"1\" style=\"font-size:13.5px;color:#8FAA98\"><a href=\"./Homepage 4b.dc.html\" style=\"color:#8FAA98\">Home<\u002Fa> / <span style=\"color:#CBDCD1\">Partner<\u002Fspan><\u002Fdiv>\n      <h1 data-intro=\"1\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(42px,5vw,68px);line-height:1;letter-spacing:-0.04em;margin:18px 0 0\">Partner with HonuVibe<\u002Fh1>\n      <p data-intro=\"1\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(20px,2.2vw,28px);letter-spacing:-0.02em;line-height:1.2;margin:16px 0 0;color:#CBDCD1;min-height:2.4em\">AI training for {{ rotator }}<\u002Fp>\n      <p data-intro=\"1\" style=\"font-size:17px;line-height:1.6;color:#CBDCD1;margin:12px 0 0;max-width:52ch\">Group licenses at a discount, curriculum written for your members, and a co-branded program your community can grow into, with your best people teaching inside it.<\u002Fp>\n      <div data-intro=\"1\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:26px\">\n        <a href=\"#enquire\" style=\"background:#E9A63B;color:#0E3629;padding:0 24px;border-radius:10px;font-size:16px;font-weight:600;min-height:54px;display:inline-flex;align-items:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-1px);box-shadow:0 10px 22px -10px rgba(233,166,59,0.6);color:#0E3629\">Start a conversation →<\u002Fa>\n        <a href=\"#offer\" style=\"border:1.5px solid #4E7A66;color:#F6F1E2;padding:0 24px;border-radius:10px;font-size:16px;font-weight:600;min-height:54px;display:inline-flex;align-items:center;transition:border-color .2s ease\" style-hover=\"border-color:#E9A63B;color:#F6F1E2\">What we offer<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-intro=\"1\" style=\"background:#F6F1E2;color:#16241D;border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:#C9552F\">Group license estimate<\u002Fspan>\n        <span style=\"font-size:12.5px;color:#8A7C63\">Indicative<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:56px;letter-spacing:-0.04em;line-height:1;color:#0E3629\">{{ seats }}<\u002Fspan>\n        <span style=\"font-size:16px;color:#5C6B62\">seats<\u002Fspan>\n      <\u002Fdiv>\n      <input type=\"range\" min=\"10\" max=\"500\" step=\"5\" value=\"{{ seats }}\" sc-camel-on-input=\"{{ onSeats }}\" aria-label=\"Number of seats\" style=\"width:100%;height:28px;margin:0;cursor:pointer\">\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px\">\n        <sc-for list=\"{{ bands }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div style=\"border-radius:9px;padding:9px 10px;background:{{ b.bg }};color:{{ b.fg }};transition:background .3s ease,color .3s ease\">\n            <div style=\"font-size:12.5px\">{{ b.range }}<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-0.01em;margin-top:2px\">{{ b.off }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;border-top:1px solid #E4DAC1\">\n          <sc-for list=\"{{ quote }}\" as=\"q\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid #E4DAC1\">\n              <span style=\"font-size:15px;color:#3E4F45\">{{ q.k }}<\u002Fspan>\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.02em;color:{{ q.c }}\">{{ q.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <a href=\"#enquire\" sc-camel-on-click=\"{{ quoteGo }}\" style=\"background:#0E3629;color:#F6F1E2;border-radius:10px;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;transition:transform .25s ease\" style-hover=\"transform:translateY(-2px);color:#F6F1E2\">Request this quote →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"who\" style=\"max-width:1320px;margin:0 auto;padding:80px 32px 0\">\n  <div data-reveal=\"1\">\n    <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#C9552F;font-weight:600\">Who we partner with<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end;margin-top:10px\">\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,46px);letter-spacing:-0.035em;line-height:1.04;color:#0E3629;margin:0;max-width:22ch;text-wrap:balance\">Any group with people who want to learn AI.<\u002Fh2>\n      <p style=\"max-width:38ch;font-size:16px;line-height:1.6;color:#3E4F45;margin:0\">If your members or staff keep asking where to start, we can run the program for them.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"margin-top:28px;margin-left:-32px;margin-right:-32px;display:flex;flex-direction:column;gap:10px\">{{ marqueeA }}{{ marqueeB }}<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"offer\" style=\"max-width:1320px;margin:0 auto;padding:80px 32px 0\">\n  <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end\">\n    <div>\n      <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#C9552F;font-weight:600\">What we offer<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,46px);letter-spacing:-0.035em;line-height:1.04;color:#0E3629;margin:10px 0 0;max-width:20ch;text-wrap:balance\">Four ways to work together.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"max-width:36ch;font-size:16px;line-height:1.6;color:#3E4F45;margin:0\">Most partners combine two or three. We scope them as one agreement.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px\">\n    <sc-for list=\"{{ offers }}\" as=\"o\" hint-placeholder-count=\"4\">\n      <a href=\"#enquire\" sc-camel-on-click=\"{{ o.pick }}\" data-reveal=\"1\" data-reveal-delay=\"{{ o.delay }}\" style=\"background:#FFFCF2;border:1px solid #E4DAC1;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s ease,box-shadow .3s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 18px 34px -18px rgba(14,54,41,0.35)\">\n        <div style=\"background:{{ o.bg }};color:{{ o.fg }};padding:22px;display:flex;flex-direction:column;gap:10px;min-height:150px\">\n          <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:12.5px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700\">{{ o.num }}<\u002Fspan><span>{{ o.tag }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;line-height:1.02;letter-spacing:-0.03em;margin-top:auto\">{{ o.name }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px;display:flex;flex-direction:column;gap:12px;flex:1\">\n          <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#3E4F45\">{{ o.blurb }}<\u002Fp>\n          <div style=\"display:grid;gap:8px\">\n            <sc-for list=\"{{ o.points }}\" as=\"p\" hint-placeholder-count=\"3\"><div style=\"display:flex;gap:9px;font-size:14.5px;line-height:1.45;color:#5C6B62\"><span style=\"color:#4E7A66;font-weight:700\">✓<\u002Fspan><span>{{ p }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"margin-top:auto;padding-top:6px;font-size:14px;font-weight:600;color:#C9552F\">Ask about {{ o.short }} →<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div data-reveal=\"1\" style=\"margin-top:20px;background:#EFE7D2;border-radius:16px;padding:clamp(22px,3vw,32px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:baseline\">\n      <h3 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;color:#0E3629;margin:0\">Also available<\u002Fh3>\n      <span style=\"font-size:14.5px;color:#5C6B62\">Add any of these to a partnership.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:2px;background:#E4DAC1;border-radius:12px;overflow:hidden\">\n      <sc-for list=\"{{ extras }}\" as=\"x\" hint-placeholder-count=\"8\">\n        <div style=\"background:#FFFCF2;padding:18px 20px;display:flex;flex-direction:column;gap:6px;transition:background .2s ease\" style-hover=\"background:#F6F1E2\">\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#C9552F;flex:none\"><\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-0.01em;color:#0E3629\">{{ x.t }}<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#5C6B62\">{{ x.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faculty\" style=\"max-width:1320px;margin:0 auto;padding:80px 32px 0\">\n  <div style=\"background:#0E3629;color:#F6F1E2;border-radius:20px;padding:clamp(26px,3.6vw,48px)\">\n    <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px;align-items:end\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#E9A63B;font-weight:600\">Member teachers<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,46px);letter-spacing:-0.035em;line-height:1.04;margin:10px 0 0;max-width:20ch;text-wrap:balance\">Your best community members can become teachers.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:16.5px;line-height:1.65;color:#CBDCD1;margin:0;max-width:56ch\">The most motivated people in the community don’t just finish the program — they can grow into paid teachers inside it, building courses and earning a share of what they ship. Your community becomes its own faculty, and the knowledge keeps compounding long after the first cohort ends.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px\">\n      <sc-for list=\"{{ path }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div data-reveal=\"1\" data-rev x),1fr));gap:24px;align-items:center\">\n        <div>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em\">Where each course sale goes<\u002Fdiv>\n          <p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:#8FAA98\">Indicative split. Final terms are set in the partnership agreement.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div ref=\"{{ splitRef }}\" style=\"display:flex;height:16px;border-radius:999px;overflow:hidden;background:#16483A\">\n            <sc-for list=\"{{ split }}\" as=\"p\" hint-placeholder-count=\"3\"><span style=\"width:{{ p.w }};background:{{ p.c }};transition:width 1.1s cubic-bezier(.2,.7,.2,1)\"><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 22px\">\n            <sc-for list=\"{{ split }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"width:10px;height:10px;border-radius:3px;background:{{ p.c }};flex:none;align-self:center\"><\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.02em;color:#F6F1E2\">{{ p.pct }}<\u002Fspan><span style=\"font-size:14.5px;color:#CBDCD1\">{{ p.who }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"models\" style=\"max-width:1320px;margin:0 auto;padding:80px 32px 0\">\n  <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end\">\n    <div>\n      <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#C9552F;font-weight:600\">Partnership levels<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,46px);letter-spacing:-0.035em;line-height:1.04;color:#0E3629;margin:10px 0 0\">Start small, grow into it.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"max-width:38ch;font-size:16px;line-height:1.6;color:#3E4F45;margin:0\">Many partners start with seats and move up once members are using it every week.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;align-items:stretch\">\n    <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n      <div data-reveal=\"1\" data-reveal-delay=\"{{ t.delay }}\" style=\"background:{{ t.bg }};color:{{ t.fg }};border:1px solid {{ t.border }};border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px;transition:transform .3s ease,box-shadow .3s ease\" style-hover=\"transform:translateY(-3px);box-shadow:0 22px 44px -22px rgba(14,54,41,0.4)\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:center\">\n            <h3 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.02em;margin:0\">{{ t.name }}<\u002Fh3>\n            <sc-if value=\"{{ t.popular }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:#E9A63B;color:#0E3629;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 9px;border-radius:6px\">Most partners<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size:14.5px;color:{{ t.sub }};margin-top:4px\">{{ t.tag }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showPrices }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\"><span style=\"font-size:15px;color:{{ t.sub }}\">{{ t.unit }}<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;letter-spacing:-0.04em;line-height:1\">{{ t.price }}<\u002Fspan><span style=\"font-size:15px;color:{{ t.sub }}\">{{ t.per }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;gap:10px\">\n          <sc-for list=\"{{ t.includes }}\" as=\"f\" hint-placeholder-count=\"4\"><div style=\"display:flex;gap:10px;font-size:15px;line-height:1.5;color:{{ t.sub }}\"><span style=\"color:{{ t.check }};font-weight:700\">✓<\u002Fspan><span>{{ f }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <a href=\"#enquire\" sc-camel-on-click=\"{{ t.pick }}\" style=\"margin-top:auto;background:{{ t.btnBg }};color:{{ t.btnFg }};border-radius:10px;min-height:54px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16.5px;transition:transform .25s ease\" style-hover=\"transform:translateY(-2px)\">{{ t.cta }}<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"max-width:1320px;margin:0 auto;padding:80px 32px 0\">\n  <div data-reveal=\"1\">\n    <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#C9552F;font-weight:600\">How it runs<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,3.6vw,46px);letter-spacing:-0.035em;line-height:1.04;color:#0E3629;margin:10px 0 0\">From first call to first cohort.<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px\">\n    <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div data-reveal=\"1\" data-reveal-delay=\"{{ s.delay }}\" style=\"background:#FFFCF2;border:1px solid #E4DAC1;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#C9552F\">{{ s.num }}<\u002Fspan><span style=\"font-size:12px;lett \n  startQuotes() { if (!this.reduce) this._qt = setInterval(() => this.setState(s => ({ q: (s.q || 0) + 1 })), 6500); }\n  componentDidUpdate(_, prev) {\n    const el = this.quoteRef.current;\n    if (!this.reduce && el && el.animate && prev.q !== this.state.q) el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 600, easing: 'cubic-bezier(.2,.7,.2,1)' });\n  }\n  componentDidMount() {\n    this.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (this.state.q == null) this.setState({ q: 0 });\n    this.startQuotes();\n    if (this.reduce) { this.setState({ splitOn: true }); return; }\n    const ease = 'cubic-bezier(.2,.7,.2,1)';\n    if (this.props.animateHero ?? true) {\n      document.querySelectorAll('[data-intro]').forEach((el, i) => el.animate && el.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 750, delay: 80 + i * 90, easing: ease, fill: 'backwards' }));\n      this._t = setInterval(() => this.setState(s => ({ rot: s.rot + 1 })), 3600);\n    }\n    if (this.props.scrollReveal ?? true) setTimeout(() => this.reveal(ease), 60);\n    const fac = document.getElementById('faculty');\n    if (fac) {\n      this._fio = new IntersectionObserver(es => {\n        if (!es[0].isIntersecting) return;\n        setTimeout(() => this.setState({ splitOn: true }), 600);\n        if ((this.props.autoPath ?? true) && !this._st) {\n          setTimeout(() => this.setState({ step: 0 }), 500);\n          this._st = setInterval(() => { if (!this._hold) this.setState(s => ({ step: (s.step + 1) % 4 })); }, 2600);\n        }\n      }, { threshold: 0.3 });\n      this._fio.observe(fac);\n    }\n  }\n  componentWillUnmount() { clearInterval(this._qt); clearInterval(this._t); clearInterval(this._st); this._io && this._io.disconnect(); this._fio && this._fio.disconnect(); }\n  reveal(ease) {\n    const show = el => {\n      const d
